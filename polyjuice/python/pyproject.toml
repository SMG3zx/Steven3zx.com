[project]
name = "polyjuice"
version = "0.0.0"
description = "Source-to-source compiler built on MLIR"
requires-python = ">=3.14"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyjuice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
