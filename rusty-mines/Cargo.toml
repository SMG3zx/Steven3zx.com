[package]
name = "rusty_mines"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = ["spacetimedb"]

[dependencies]
rusty-mines-inventory = { path = "inventory-core" }
spacetimedb-sdk = { version = "2.10.*" }
dotenvy = "0.15"
reedline = "0.46"
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.11"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
directories = "6"
flate2 = "1.1.10"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
