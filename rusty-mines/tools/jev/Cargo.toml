[package]
name = "jev-harness"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "jev-harness"

# Isolated tooling: never compiled into the gateway or WASM reducers.
[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
