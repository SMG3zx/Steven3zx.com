name: steven3zx-edge

services:
  portfolio:
    build: ../portfolio/port-2
    restart: unless-stopped
    expose:
      - "8090"

  admin:
    build: ../portfolio/admin
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8091"
    environment:
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN}
      # Encrypts admin.db at rest; lives in edge/.env, never in admin_data.
      ADMIN_DB_KEY: ${ADMIN_DB_KEY}
      HOST_AGENT_URL: http://host.docker.internal:9180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:exec
    volumes:
      - admin_data:/data

  # Rollback only: start with `docker compose --profile caddy up -d caddy`
  # after `docker compose stop traefik`. Traefik is the default edge.
  caddy:
    profiles: [caddy]
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - portfolio
      - admin
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  ddns:
    image: favonia/cloudflare-ddns:1
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      IP4_DOMAINS: www.steven3zx.com,steven3zx.com,janus.steven3zx.com,ssh.steven3zx.com,git.steven3zx.com
      IP6_PROVIDER: none
      PROXIED: is(www.steven3zx.com,steven3zx.com,janus.steven3zx.com,git.steven3zx.com)

  # Self-hosted Git at git.steven3zx.com (Traefik routes it, see traefik/dynamic/sites.yml).
  # Replaces the native Windows service that listened on host port 30001. Its data
  # lives in gitea_data, copied from the old GITEA/ folder.
  gitea:
    image: gitea/gitea:1.27.3
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
    expose:
      - "3000"
    ports:
      # Git over SSH. The host port matches the native instance, so clone URLs keep working.
      - "30000:2222"
    volumes:
      - gitea_data:/data
    networks:
      - default
      - ci

  # Gitea Actions runner. It runs CI jobs as containers on this Docker engine, so
  # it has the Docker socket. That makes it root-equivalent on this host: only
  # workflows in repos you own should be able to reach it.
  gitea-runner:
    image: gitea/act_runner:0.5
    restart: unless-stopped
    depends_on:
      - gitea
    working_dir: /data
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f /data/.runner ]; then
          act_runner register --no-interactive --instance http://gitea:3000 \
            --token "$$GITEA_RUNNER_REGISTRATION_TOKEN" --name "$$RUNNER_NAME" --labels "$$RUNNER_LABELS"
        fi
        exec act_runner daemon --config /config/config.yaml
    environment:
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
      RUNNER_NAME: steven3zx-edge-runner
      RUNNER_LABELS: "ubuntu-latest:docker://node:26-bookworm,node:docker://node:26-bookworm,golang:docker://golang:1.27-bookworm"
    volumes:
      - runner_data:/data
      - ./gitea/runner-config.yaml:/config/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - ci

  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    depends_on:
      - portfolio
      - admin
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Read by Traefik's Cloudflare DNS provider for the wildcard DNS-01 challenge.
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_data:/letsencrypt

  # Tailnet control server and embedded DERP relay. Traefik serves its HTTPS side at
  # ts.steven3zx.com; STUN for DERP is published directly on UDP 3478.
  headscale:
    image: headscale/headscale:v0.29.5
    restart: unless-stopped
    command: ["serve"]
    expose:
      - "8080"
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/derp.yaml:/etc/headscale/derp.yaml:ro
      - headscale_data:/var/lib/headscale

  # Tailscale's DERP relay as a container. NOT the active relay: derper runs natively on
  # Windows (C:\janus\derp\bin\derper.exe), because a container's published UDP port
  # rewrites the source address STUN reports, which made netcheck see 172.19.0.1 and
  # MappingVariesByDestIP: true. The native relay reports the real address. Kept for
  # reference; start it only with --profile derper-container and stop derper.exe first.
  # The image is built from the pinned Tailscale module:
  #   docker build -t janus-derper:v1.104.2 edge/derper
  derper:
    profiles: [derper-container]
    image: janus-derper:v1.104.2
    restart: unless-stopped
    command:
      - "--hostname=derp.steven3zx.com"
      - "--certmode=manual"
      - "--certdir=/certs"
      - "--a=:8443"
      - "--http-port=-1"
      - "--stun"
      - "--stun-port=3478"
    expose:
      - "8443"
    ports:
      - "3478:3478/udp"
    volumes:
      - derper_certs:/certs:ro
      - derper_data:/var/lib/derper

networks:
  # Jobs run here. See gitea/runner-config.yaml.
  ci: {}

volumes:
  gitea_data:
  runner_data:
  admin_data:
  caddy_data:
  caddy_config:
  traefik_data:
  headscale_data:
  derper_certs:
    external: true
  derper_data:
