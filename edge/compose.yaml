name: steven3zx-edge

services:
  portfolio:
    build: ../portfolio/port-2
    restart: unless-stopped
    expose:
      - "8090"

  admin:
    build: ../portfolio/admin
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8091"
    environment:
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN}
      HOST_AGENT_URL: http://host.docker.internal:9180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:exec
    volumes:
      - admin_data:/data

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - portfolio
      - admin
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  ddns:
    image: favonia/cloudflare-ddns:1
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      IP4_DOMAINS: www.steven3zx.com,steven3zx.com,janus.steven3zx.com,ssh.steven3zx.com
      IP6_PROVIDER: none
      PROXIED: is(www.steven3zx.com,steven3zx.com,janus.steven3zx.com)

volumes:
  admin_data:
  caddy_data:
  caddy_config:
