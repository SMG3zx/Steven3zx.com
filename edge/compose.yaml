name: steven3zx-edge

services:
  portfolio:
    build: ../portfolio/port-2
    restart: unless-stopped
    expose:
      - "8090"

  admin:
    build: ../portfolio/admin
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8091"
    environment:
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN}
      # Encrypts admin.db at rest; lives in edge/.env, never in admin_data.
      ADMIN_DB_KEY: ${ADMIN_DB_KEY}
      HOST_AGENT_URL: http://host.docker.internal:9180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:exec
    volumes:
      - admin_data:/data

  # Rollback only: start with `docker compose --profile caddy up -d caddy`
  # after `docker compose stop traefik`. Traefik is the default edge.
  caddy:
    profiles: [caddy]
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - portfolio
      - admin
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  ddns:
    image: favonia/cloudflare-ddns:1
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      IP4_DOMAINS: www.steven3zx.com,steven3zx.com,janus.steven3zx.com,ssh.steven3zx.com
      IP6_PROVIDER: none
      PROXIED: is(www.steven3zx.com,steven3zx.com,janus.steven3zx.com)

  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    depends_on:
      - portfolio
      - admin
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Read by Traefik's Cloudflare DNS provider for the wildcard DNS-01 challenge.
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_data:/letsencrypt

volumes:
  admin_data:
  caddy_data:
  caddy_config:
  traefik_data:
