name: steven3zx-edge

services:
  portfolio:
    build: ../portfolio/port-2
    restart: unless-stopped
    expose:
      - "8090"

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - portfolio
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
