# Static configuration for the native Windows Traefik. render-config.ps1 fills in the
# {{...}} placeholders and writes the result next to the service's data, because Traefik
# ignores environment overrides when a config file is present. Routes live in ./dynamic.
#
# Running natively means Traefik sees each client's real address instead of Docker's
# gateway. For the Cloudflare-proxied names the peer is a Cloudflare edge, so those ranges
# are trusted and the client address is taken from X-Forwarded-For. Nothing else is
# trusted: not loopback, not 172.x.

api:
  dashboard: false

experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1

entryPoints:
  web:
    address: "{{WEB_ADDR}}"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
    forwardedHeaders:
      trustedIPs: &cloudflare
        # Cloudflare's published ranges, https://www.cloudflare.com/ips-v4 and /ips-v6.
        # Refresh them here and in dynamic/crowdsec.yml if Cloudflare changes the list.
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
        {{EXTRA_TRUSTED}}
  websecure:
    address: "{{SECURE_ADDR}}"
    http3: {}
    forwardedHeaders:
      trustedIPs: *cloudflare
  # Tailnet-only. Bound to this machine's tailnet address, so the internet cannot reach
  # it. No forwarded headers are trusted here.
  private:
    address: "{{PRIVATE_ADDR}}"

providers:
  file:
    directory: "{{DYNAMIC_DIR}}"
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      # Placeholder: replace with a mailbox you read. Let's Encrypt sends expiry notices here.
      email: "acme-placeholder@steven3zx.com"
      storage: "{{DATA_DIR}}/acme.json"
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        propagation:
          delayBeforeChecks: 15s

log:
  level: INFO

# Only errors and probes go to the file CrowdSec reads, which keeps it small. Traefik
# cannot reopen a log on Windows, so there is no rotation: the install script starts a
# fresh file each time the service is installed.
accessLog:
  filePath: "{{DATA_DIR}}/logs/traefik-access.log"
  filters:
    statusCodes:
      - "400-599"
