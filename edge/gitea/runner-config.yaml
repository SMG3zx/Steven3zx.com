# act_runner daemon configuration for the edge stack. Full reference:
#   docker run --rm --entrypoint act_runner gitea/act_runner:0.5 generate-config

log:
  level: info

runner:
  # Written by `act_runner register` on first start; lives in the runner_data volume.
  file: /data/.runner
  capacity: 2
  timeout: 3h
  # Jobs fetch actions from github.com by default, which is what actions/checkout needs.
  fetch_timeout: 5s
  # Idle polling backs off to fetch_interval_max, so a push could wait a minute for a
  # job. Cap it at 5s so a pushed run starts within seconds.
  fetch_interval: 2s
  fetch_interval_max: 5s
  labels: []

container:
  # Job containers join this network only. It holds gitea and the runner, and nothing
  # else, so a job can reach the Git server and nothing on the rest of the edge.
  network: steven3zx-edge_ci
  # Named volumes only, no host paths. The shared CI cache is the one volume jobs may mount.
  valid_volumes:
    - steven3zx-ci-cache
  # Mounts the shared CI cache volume into every job container. The workflow sets the
  # cache paths, see .gitea/workflows/admin-ci.yml.
  options: "-v steven3zx-ci-cache:/ci-cache"
  force_pull: false
