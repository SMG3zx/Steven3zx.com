[project]
name = "vinci-mojo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mojo==1.2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.pyright]
# The pyright CLI has no --strict flag; strictness is set here and `pyright py/` uses it.
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["py"]

[tool.ruff]
line-length = 100
