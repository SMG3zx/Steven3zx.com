<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Memory · Metrics</title><style>
:root{color-scheme:dark;--bg:#08111f;--panel:#0d1a2d;--line:#20324d;--muted:#8da0bb;--text:#e7effa;--accent:#7dd3fc;--ok:#a7e86e;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% -20%,#173253 0,#08111f 50%);font:14px Inter,system-ui;color:var(--text)}header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px}header strong{font-size:16px}header span{color:var(--muted)}a,button{color:var(--accent)}button{background:#0d2139;border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{border-color:var(--accent)}main{max-width:1050px;margin:auto;padding:30px 20px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{color:var(--muted)}.status{min-height:26px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.card h2{font-size:14px;margin:0 0 14px}.value{font-size:26px}.label{font-size:12px;color:var(--muted);margin-top:4px}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{margin:14px 0 0;padding:0;list-style:none;color:var(--muted);font-size:12px}.list li{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:7px 0}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}@media(max-width:760px){header{padding:0 14px}.grid{grid-template-columns:1fr}.toolbar{align-items:stretch;gap:10px;flex-direction:column}.toolbar button{width:100%}}
</style><style>.api-access{display:inline-flex;align-items:center;gap:6px;margin-left:auto}.api-access summary{color:var(--accent,#7dd3fc);cursor:pointer}.api-access-panel{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel,#0d1a2d);border:1px solid var(--line,#20324d);border-radius:8px;position:absolute;right:14px;top:52px;z-index:4;box-shadow:0 12px 30px #0008}.api-access-panel input{width:190px;max-width:55vw;background:#091424;color:var(--text,#e7effa);border:1px solid var(--line,#20324d);border-radius:6px;padding:7px}.api-access-panel button{padding:7px 9px}.api-access-status{font-size:11px;color:var(--muted,#8da0bb)}@media(max-width:700px){.api-access{margin-left:0}.api-access-panel{left:14px;right:14px;top:100px;flex-wrap:wrap}.api-access-panel input{flex:1;min-width:150px}}</style><style>.global-nav{min-width:0}@media(max-width:700px){header{height:auto;min-height:62px;flex-wrap:wrap;align-content:center;row-gap:10px;padding:12px 14px}header [style*="margin-left:auto"]{margin-left:0!important}.global-nav{width:100%;margin-left:0!important;overflow-x:auto;white-space:nowrap;padding-bottom:3px}.global-nav a{display:inline-block}}</style></head><body><header><strong>Personal Memory</strong><span>System metrics</span><details class="api-access" id="apiAccess"><summary>API access</summary><div class="api-access-panel"><input id="apiAccessKey" type="password" autocomplete="off" placeholder="Bearer API key" aria-label="API access key"><button type="button" id="apiAccessSave">Use key</button><button type="button" id="apiAccessClear">Clear</button><span class="api-access-status" id="apiAccessStatus" role="status" aria-live="polite"></span></div></details><script>(()=>{const storageKey='personal-memory-api-key';const panel=document.getElementById('apiAccess'),input=document.getElementById('apiAccessKey'),status=document.getElementById('apiAccessStatus');if(!panel||!input||!status)return;const saved=sessionStorage.getItem(storageKey)||'';if(saved){input.value=saved;status.textContent='Key ready for this session.'}const nativeFetch=window.fetch.bind(window);window.fetch=(resource,options={})=>{const key=sessionStorage.getItem(storageKey);const target=typeof resource==='string'?new URL(resource,location.href):new URL(resource.url,location.href);if(target.origin!==location.origin)return nativeFetch(resource,options);const headers=new Headers(options.headers||{});if(key)headers.set('authorization','Bearer '+key);return nativeFetch(resource,{...options,headers}).then(response=>{if(response.status===401||response.status===403){panel.open=true;status.textContent='API access is required for this operation.'}return response})};document.getElementById('apiAccessSave').onclick=()=>{const key=input.value.trim();if(!key){status.textContent='Enter an API key first.';input.focus();return}sessionStorage.setItem(storageKey,key);status.textContent='Key saved for this browser session.';panel.open=false;location.reload()};document.getElementById('apiAccessClear').onclick=()=>{sessionStorage.removeItem(storageKey);input.value='';status.textContent='Key cleared.';panel.open=false;location.reload()}})();</script><script>(()=>{const input=document.getElementById('apiAccessKey');if(input)input.placeholder='API key';const nativeOpen=window.open.bind(window);const localApi=(value)=>{const url=new URL(String(value),location.href);return url.origin===location.origin&&url.pathname.startsWith('/v1/')};window.open=(value,target,features)=>{if(!localApi(value))return nativeOpen(value,target,features);fetch(String(value)).then(async response=>{if(!response.ok)throw new Error('Download failed ('+response.status+')');const blob=await response.blob();const href=URL.createObjectURL(blob);nativeOpen(href,target,features);setTimeout(()=>URL.revokeObjectURL(href),60000)}).catch(error=>{const status=document.getElementById('apiAccessStatus');if(status){status.textContent=error.message;document.getElementById('apiAccess')?.setAttribute('open','')}});return null};document.addEventListener('click',event=>{const target=event.target;if(!(target instanceof Element))return;const link=target.closest('a[href]');if(!link||!localApi(link.href))return;event.preventDefault();fetch(link.href).then(async response=>{if(!response.ok)throw new Error('Source lookup failed ('+response.status+')');const blob=await response.blob();const href=URL.createObjectURL(blob);location.href=href;setTimeout(()=>URL.revokeObjectURL(href),60000)}).catch(error=>{const status=document.getElementById('apiAccessStatus');if(status){status.textContent=error.message;document.getElementById('apiAccess')?.setAttribute('open','')}})},true)})();</script><nav class="global-nav" aria-label="Primary navigation" style="margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><a href="/chat">Chat</a><a href="/ingest">Capture</a><a href="/sessions">Sessions</a><a href="/imports">Import</a><a href="/memories">Memory review</a><a href="/jobs">Processing</a><a href="/metrics" aria-current="page">Metrics</a><a href="/status">Status</a><a href="/">Audit console</a></nav></header><main><div class="toolbar"><span class="muted">Redacted aggregate behavior; no prompts, answers, or memory content is shown.</span><button id="refresh" aria-label="Refresh system metrics">Refresh</button></div><div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div><section id="metrics" class="grid" aria-live="polite"></section></main><script>
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pct(v){return (Number(v||0)*100).toFixed(1)+'%'}function list(obj){return Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<li><span>'+esc(k)+'</span><span>'+esc(v)+'</span></li>').join('')||'<li><span>None yet</span><span>—</span></li>'}async function load(){try{const r=await fetch('/v1/admin/metrics');const d=await r.json();if(!r.ok)throw Error(d.error||'Metrics unavailable');const retrieval=d.retrievals||{},validation=d.answerValidation||{};$('metrics').innerHTML='<article class="card"><h2>Retrieval</h2><div class="subgrid"><div><div class="value">'+esc(retrieval.count)+'</div><div class="label">requests</div></div><div><div class="value '+(retrieval.errors?'bad':'')+'">'+esc(pct(retrieval.errorRate))+'</div><div class="label">error rate</div></div><div><div class="value">'+esc(Number(retrieval.meanLatencyMs||0).toFixed(1))+' ms</div><div class="label">mean latency</div></div><div><div class="value">'+esc(Number(retrieval.p95LatencyMs||0).toFixed(1))+' ms</div><div class="label">p95 latency</div></div></div></article><article class="card"><h2>Answer validation</h2><div class="subgrid"><div><div class="value">'+esc(validation.count||0)+'</div><div class="label">checked</div></div><div><div class="value '+(validation.rejected?'bad':'')+'">'+esc(pct(validation.rejectionRate))+'</div><div class="label">rejection rate</div></div></div><ul class="list"><li><span>Rejected</span><span>'+esc(validation.rejected||0)+'</span></li></ul></article><article class="card"><h2>Service</h2><div class="value">'+esc(d.uptimeSeconds||0)+' s</div><div class="label">metrics window uptime</div><ul class="list"><li><span>Latency samples</span><span>'+esc(retrieval.retainedLatencySamples||0)+'</span></li></ul></article><article class="card"><h2>Retrieval routes</h2><ul class="list">'+list(retrieval.routes)+'</ul></article><article class="card"><h2>Retrieval methods</h2><ul class="list">'+list(retrieval.methods)+'</ul></article>';$('status').textContent='Updated '+new Date().toLocaleTimeString()+'. Metrics are bounded and redacted.'}catch(error){$('metrics').innerHTML='<div class="card"><div class="bad">'+esc(error.message)+'</div><div class="label">Check authentication or return to Status for recovery guidance.</div></div>';$('status').textContent='Unable to load metrics.'}}$('refresh').onclick=load;load();setInterval(load,10000);
</script><script>(()=>{const main=document.querySelector('main');if(!main)return;const panel=document.createElement('section');panel.id='metricsTrend';panel.setAttribute('aria-live','polite');panel.innerHTML='<article style="background:var(--panel,#0d1a2d);border:1px solid var(--line,#20324d);border-radius:10px;padding:16px;margin-top:14px"><h2 style="font-size:14px;margin:0 0 12px">Recent trend</h2><div id="metricsAlerts" role="status" aria-live="polite"></div><div id="metricsTrendRows"></div></article>';main.append(panel);const safe=value=>String(value??'').replace(/[&<>"]/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[character]));const render=async()=>{try{const response=await fetch('/v1/admin/metrics');const data=await response.json();if(!response.ok)throw new Error(data.error||'Metrics unavailable');const alerts=data.alerts||[];document.getElementById('metricsAlerts').innerHTML=alerts.length?alerts.map(alert=>'<div style="color:#fb7185;margin-bottom:6px">Alert: '+safe(alert.message)+'</div>').join(''):'<div style="color:#a7e86e;margin-bottom:8px">No active thresholds.</div>';const trend=(data.trend||[]).slice(-12);const maximum=Math.max(1,...trend.map(item=>Number(item.retrievals)||0));document.getElementById('metricsTrendRows').innerHTML=trend.length?trend.map(item=>{const width=Math.max(2,Math.round((Number(item.retrievals)||0)/maximum*100));return '<div style="display:grid;grid-template-columns:135px 1fr 90px;gap:8px;align-items:center;border-top:1px solid var(--line,#20324d);padding:7px 0;font-size:12px"><time style="color:var(--muted,#8da0bb)">'+safe(new Date(item.minute).toLocaleTimeString())+'</time><div title="Retrievals '+safe(item.retrievals)+'" style="height:10px;background:linear-gradient(90deg,#7dd3fc '+width+'%,#172b45 '+width+'%)"></div><span style="color:var(--muted,#8da0bb)">'+safe(item.retrievals)+' req · '+safe(Number(item.meanLatencyMs||0).toFixed(1))+' ms</span></div>'}).join(''):'<div style="color:var(--muted,#8da0bb)">No trend samples yet.</div>'}catch(error){document.getElementById('metricsAlerts').textContent=error.message}};render();setInterval(render,10000)})();</script><script>(()=>{const article=document.querySelector('#metricsTrend article');if(!article)return;const cost=document.createElement('div');cost.id='metricsCost';cost.style.cssText='color:var(--muted,#8da0bb);font-size:12px;margin-bottom:10px';article.querySelector('h2')?.after(cost);const render=async()=>{try{const response=await fetch('/v1/admin/metrics');const data=await response.json();if(!response.ok)throw new Error(data.error||'Metrics unavailable');cost.textContent='Estimated retrieval cost this process: </html>+Number(data.retrievals?.estimatedCostUsd||0).toFixed(6)}catch(error){cost.textContent=error.message}};render();setInterval(render,10000)})();</script></body></html>
