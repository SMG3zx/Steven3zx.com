<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Memory · Processing</title><style>
:root{color-scheme:dark;--panel:#0d1a2d;--line:#20324d;--muted:#8da0bb;--text:#e7effa;--accent:#7dd3fc;--ok:#a7e86e;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% -20%,#173253 0,#08111f 50%);font:14px Inter,system-ui;color:var(--text)}header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px}header strong{font-size:16px}header span{color:var(--muted)}a,button{color:var(--accent)}button{background:#0d2139;border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}.danger{color:var(--danger)}button:disabled{opacity:.55;cursor:wait}main{max-width:1050px;margin:auto;padding:30px 20px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:8px}.toolbar select{background:#091424;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}.job{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin:10px 0}.head{display:flex;justify-content:space-between;gap:12px}.meta{color:var(--muted);font-size:12px}.success{color:var(--ok)}.error{color:var(--danger)}.pending{color:#fbbf24}.source{margin:10px 0;color:var(--muted);white-space:pre-wrap}.proposal{background:#091424;border:1px solid var(--line);border-radius:7px;padding:10px;margin:10px 0;white-space:pre-wrap;font:12px ui-monospace,monospace;max-height:240px;overflow:auto}.empty{color:var(--muted);padding:50px;text-align:center}.action-status{min-height:25px;margin-bottom:14px}.action-status a{color:var(--accent)}.action-status button{margin-left:8px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}@media(max-width:700px){header{padding:0 14px}main{padding:20px 14px}.toolbar{align-items:stretch;flex-wrap:wrap}.toolbar label,.toolbar button{width:100%}.action-status button{margin:8px 8px 0 0}}</style><style>.api-access{display:inline-flex;align-items:center;gap:6px;margin-left:auto}.api-access summary{color:var(--accent,#7dd3fc);cursor:pointer}.api-access-panel{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel,#0d1a2d);border:1px solid var(--line,#20324d);border-radius:8px;position:absolute;right:14px;top:52px;z-index:4;box-shadow:0 12px 30px #0008}.api-access-panel input{width:190px;max-width:55vw;background:#091424;color:var(--text,#e7effa);border:1px solid var(--line,#20324d);border-radius:6px;padding:7px}.api-access-panel button{padding:7px 9px}.api-access-status{font-size:11px;color:var(--muted,#8da0bb)}@media(max-width:700px){.api-access{margin-left:0}.api-access-panel{left:14px;right:14px;top:100px;flex-wrap:wrap}.api-access-panel input{flex:1;min-width:150px}}</style><style>.global-nav{min-width:0}@media(max-width:700px){header{height:auto;min-height:62px;flex-wrap:wrap;align-content:center;row-gap:10px;padding:12px 14px}header [style*="margin-left:auto"]{margin-left:0!important}.global-nav{width:100%;margin-left:0!important;overflow-x:auto;white-space:nowrap;padding-bottom:3px}.global-nav a{display:inline-block}}</style></head><body><header><strong>Personal Memory</strong><span>Processing & consolidation</span><details class="api-access" id="apiAccess"><summary>API access</summary><div class="api-access-panel"><input id="apiAccessKey" type="password" autocomplete="off" placeholder="Bearer API key" aria-label="API access key"><button type="button" id="apiAccessSave">Use key</button><button type="button" id="apiAccessClear">Clear</button><span class="api-access-status" id="apiAccessStatus" role="status" aria-live="polite"></span></div></details><script>(()=>{const storageKey='personal-memory-api-key';const panel=document.getElementById('apiAccess'),input=document.getElementById('apiAccessKey'),status=document.getElementById('apiAccessStatus');if(!panel||!input||!status)return;const saved=sessionStorage.getItem(storageKey)||'';if(saved){input.value=saved;status.textContent='Key ready for this session.'}const nativeFetch=window.fetch.bind(window);window.fetch=(resource,options={})=>{const key=sessionStorage.getItem(storageKey);const target=typeof resource==='string'?new URL(resource,location.href):new URL(resource.url,location.href);if(target.origin!==location.origin)return nativeFetch(resource,options);const headers=new Headers(options.headers||{});if(key)headers.set('authorization','Bearer '+key);return nativeFetch(resource,{...options,headers}).then(response=>{if(response.status===401||response.status===403){panel.open=true;status.textContent='API access is required for this operation.'}return response})};document.getElementById('apiAccessSave').onclick=()=>{const key=input.value.trim();if(!key){status.textContent='Enter an API key first.';input.focus();return}sessionStorage.setItem(storageKey,key);status.textContent='Key saved for this browser session.';panel.open=false;location.reload()};document.getElementById('apiAccessClear').onclick=()=>{sessionStorage.removeItem(storageKey);input.value='';status.textContent='Key cleared.';panel.open=false;location.reload()}})();</script><script>(()=>{const input=document.getElementById('apiAccessKey');if(input)input.placeholder='API key';const nativeOpen=window.open.bind(window);const localApi=(value)=>{const url=new URL(String(value),location.href);return url.origin===location.origin&&url.pathname.startsWith('/v1/')};window.open=(value,target,features)=>{if(!localApi(value))return nativeOpen(value,target,features);fetch(String(value)).then(async response=>{if(!response.ok)throw new Error('Download failed ('+response.status+')');const blob=await response.blob();const href=URL.createObjectURL(blob);nativeOpen(href,target,features);setTimeout(()=>URL.revokeObjectURL(href),60000)}).catch(error=>{const status=document.getElementById('apiAccessStatus');if(status){status.textContent=error.message;document.getElementById('apiAccess')?.setAttribute('open','')}});return null};document.addEventListener('click',event=>{const target=event.target;if(!(target instanceof Element))return;const link=target.closest('a[href]');if(!link||!localApi(link.href))return;event.preventDefault();fetch(link.href).then(async response=>{if(!response.ok)throw new Error('Source lookup failed ('+response.status+')');const blob=await response.blob();const href=URL.createObjectURL(blob);location.href=href;setTimeout(()=>URL.revokeObjectURL(href),60000)}).catch(error=>{const status=document.getElementById('apiAccessStatus');if(status){status.textContent=error.message;document.getElementById('apiAccess')?.setAttribute('open','')}})},true)})();</script><nav class="global-nav" aria-label="Primary navigation" style="margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><a href="/ingest">Capture</a><a href="/sessions">Sessions</a><a href="/imports">Import</a><a href="/memories">Memory review</a><a href="/jobs" aria-current="page">Processing</a><a href="/metrics">Metrics</a><a href="/status">Status</a><a href="/">Audit console</a></nav></header><main><div class="toolbar"><label>Status <select id="filter" aria-label="Job status"><option value="">All jobs</option><option>queued</option><option>running</option><option>completed</option><option>failed</option></select></label><button id="refresh" aria-label="Refresh processing jobs">Refresh</button><span class="meta" id="summary" role="status" aria-live="polite" aria-atomic="true"></span></div><div id="actionStatus" class="meta action-status" role="status" aria-live="polite" aria-atomic="true"></div><section id="jobs" aria-live="polite"></section></main><script>
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function report(label,traceId){$('actionStatus').innerHTML=esc(label)+(traceId?' · <a href="/?traceId='+encodeURIComponent(traceId)+'">Inspect trace</a>':'')}async function call(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json();if(!r.ok){const error=new Error(d.error||'Job action failed');error.traceId=d.traceId;throw error}return d}let confirmationResolve;function confirmAction(message){return new Promise(resolve=>{confirmationResolve=resolve;$('actionStatus').innerHTML=esc(message)+' <button id="confirmYes">Confirm rejection</button><button id="confirmNo">Cancel</button>';$('confirmYes').focus();$('confirmYes').onclick=()=>{confirmationResolve=undefined;$('actionStatus').textContent='';resolve(true)};$('confirmNo').onclick=()=>{confirmationResolve=undefined;$('actionStatus').textContent='';resolve(false)}})}function candidateText(j){if(!j.proposal)return '';try{const p=JSON.parse(j.proposal);return JSON.stringify({memories:p.memories||[],entities:p.entities||[],claims:p.claims||[],procedures:p.procedures||[]},null,2)}catch{return String(j.proposal)}}function candidateSummary(j){if(!j.proposal)return '';try{const p=JSON.parse(j.proposal);return ['memories','entities','claims','procedures'].map(key=>(p[key]||[]).length+' '+key).join(' · ')}catch{return 'proposal available'}}async function load(){const q=$('filter').value;try{const r=await fetch('/v1/jobs?limit=100'+(q?'&status='+q:''));const d=await r.json();if(!r.ok)throw Error(d.error||'Job API failed');$('summary').textContent=(d.jobs||[]).length+' jobs · refreshes every 3 seconds';$('jobs').innerHTML=(d.jobs||[]).map(j=>{const approval=j.approvalStatus||'approved';const proposal=candidateText(j);const actions=approval==='pending'?'<button class="preview" data-id="'+esc(j.id)+'">Preview candidates</button><button class="approve" data-id="'+esc(j.id)+'">Approve extraction</button><button class="reject danger" data-id="'+esc(j.id)+'">Reject proposal</button>':j.status==='failed'?'<button class="retry" data-id="'+esc(j.id)+'">Retry</button>':'';const sourcePreview=j.eventContent?'<details><summary>View source event</summary><div class="source">'+esc(j.eventContent)+'</div></details>':'';return '<article class="job"><div class="head"><strong>'+esc(j.kind)+'</strong><span class="'+(j.status==='failed'?'error':j.status==='completed'?'success':approval==='pending'?'pending':'')+'">'+esc(j.status)+' · approval '+esc(approval)+'</span></div><div class="meta">'+esc(j.id)+' · target '+esc(j.targetId)+' · attempts '+esc(j.attempts??0)+'</div><div class="source">source: '+esc(j.eventKind||'derived')+' · '+esc(j.eventSource||'unknown')+(j.error?'
error: '+esc(j.error):'')+'</div>'+sourcePreview+(proposal?'<details><summary>Reviewed candidates ('+esc(candidateSummary(j))+')</summary><div class="proposal">'+esc(proposal)+'</div></details>':'')+actions+'</article>'}).join('')||'<div class="empty">No processing jobs match this filter.</div>';bind()}catch(e){$('jobs').innerHTML='<div class="empty error">'+esc(e.message)+'</div>';report('Unable to load jobs.')}}function bind(){document.querySelectorAll('.preview').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const d=await call('/v1/jobs/'+encodeURIComponent(b.dataset.id)+'/preview');report('Candidate preview saved.',d.traceId)}catch(e){report(e.message,e.traceId)}await load()});document.querySelectorAll('.retry').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const d=await call('/v1/jobs/'+encodeURIComponent(b.dataset.id)+'/retry');report('Job requeued for retry.',d.traceId)}catch(e){report(e.message,e.traceId)}await load()});document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const d=await call('/v1/jobs/'+encodeURIComponent(b.dataset.id)+'/approve');report('Extraction approved.',d.traceId)}catch(e){report(e.message,e.traceId)}await load()});document.querySelectorAll('.reject').forEach(b=>b.onclick=async()=>{if(!await confirmAction('Reject this consolidation proposal?'))return;b.disabled=true;try{const d=await call('/v1/jobs/'+encodeURIComponent(b.dataset.id)+'/reject',{reason:'rejected during review'});report('Proposal rejected.',d.traceId)}catch(e){report(e.message,e.traceId)}await load()})}$('filter').onchange=load;$('refresh').onclick=load;load();setInterval(load,3000);
</script><script>(()=>{const status=document.getElementById('actionStatus');if(!status)return;document.addEventListener('click',event=>{const target=event.target;if(!(target instanceof Element))return;const button=target.closest('.approve');if(!button||button.dataset.confirmed==='1')return;event.preventDefault();event.stopImmediatePropagation();const previous=document.activeElement;status.innerHTML='Approve these extracted candidates? <button id="confirmApproval">Confirm approval</button><button id="cancelApproval">Cancel</button>';const close=()=>{status.textContent='';if(previous instanceof HTMLElement)previous.focus()};document.getElementById('cancelApproval').onclick=close;document.getElementById('confirmApproval').onclick=()=>{button.dataset.confirmed='1';close();button.click();delete button.dataset.confirmed};document.getElementById('confirmApproval').focus()},true)})();</script></body></html>
