<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Memory · Audit</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#0d1a2d;--line:#20324d;--muted:#8da0bb;--text:#e7effa;--ok:#a7e86e;--accent:#7dd3fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,#173253 0,#08111f 45%);font:14px Inter,ui-sans-serif,system-ui;color:var(--text)}header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px}header strong{font-size:16px;letter-spacing:.02em}header span{color:var(--muted)}main{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 62px)}aside{border-right:1px solid var(--line);padding:18px;overflow:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.filters input{grid-column:1/-1}input,select,button{background:#0a1526;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px}input{width:100%}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}.run{padding:13px 10px;border-bottom:1px solid var(--line);cursor:pointer}.run:hover,.run.active{background:#12243c}.run h3{font-size:13px;margin:0 0 7px}.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.pill{border:1px solid var(--line);border-radius:999px;padding:2px 7px}.success{color:var(--ok)}.error{color:#fb7185}section{padding:28px;overflow:auto}.empty{color:var(--muted);padding:80px 20px;text-align:center}.trace-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}.trace-head h1{font-size:22px;margin:0 0 8px}.trace-status{min-height:26px;margin-bottom:12px}.trace-status a{color:var(--accent)}.trace-status button{margin-left:8px}.tree{border-left:1px solid var(--line);margin-left:10px}.node{margin:0 0 5px;padding-left:18px;position:relative}.node:before{content:"";position:absolute;left:-1px;top:18px;width:16px;border-top:1px solid var(--line)}.node-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px}.node-title{font-weight:600}.node-kind{color:var(--accent);font-size:11px;text-transform:uppercase}.node-detail{grid-column:1/-1;display:none;color:var(--muted);white-space:pre-wrap;background:#091424;border-radius:6px;padding:10px;font:12px ui-monospace,monospace;max-height:260px;overflow:auto}.node-card.open .node-detail{display:block}.toggle{color:var(--muted);cursor:pointer}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats .pill{font-size:12px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}@media(max-width:800px){main{display:block}aside{border-right:0;border-bottom:1px solid var(--line);max-height:45vh}section{padding:18px}.trace-head{display:block}.stats{margin-top:12px}}@media(max-width:520px){.filters{display:flex;flex-wrap:wrap}.filters input,.filters select,.filters button{width:100%}}
</style><style>.api-access{display:inline-flex;align-items:center;gap:6px;margin-left:auto}.api-access summary{color:var(--accent,#7dd3fc);cursor:pointer}.api-access-panel{display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel,#0d1a2d);border:1px solid var(--line,#20324d);border-radius:8px;position:absolute;right:14px;top:52px;z-index:4;box-shadow:0 12px 30px #0008}.api-access-panel input{width:190px;max-width:55vw;background:#091424;color:var(--text,#e7effa);border:1px solid var(--line,#20324d);border-radius:6px;padding:7px}.api-access-panel button{padding:7px 9px}.api-access-status{font-size:11px;color:var(--muted,#8da0bb)}@media(max-width:700px){.api-access{margin-left:0}.api-access-panel{left:14px;right:14px;top:100px;flex-wrap:wrap}.api-access-panel input{flex:1;min-width:150px}}</style><style>.global-nav{min-width:0}@media(max-width:700px){header{height:auto;min-height:62px;flex-wrap:wrap;align-content:center;row-gap:10px;padding:12px 14px}header [style*="margin-left:auto"]{margin-left:0!important}.global-nav{width:100%;margin-left:0!important;overflow-x:auto;white-space:nowrap;padding-bottom:3px}.global-nav a{display:inline-block}}</style></head><body><header><strong>Personal Memory</strong><span>Audit console</span><span style="margin-left:auto">redacted, local-only trace view</span><details class="api-access" id="apiAccess"><summary>API access</summary><div class="api-access-panel"><input id="apiAccessKey" type="password" autocomplete="off" placeholder="Bearer API key" aria-label="API access key"><button type="button" id="apiAccessSave">Use key</button><button type="button" id="apiAccessClear">Clear</button><span class="api-access-status" id="apiAccessStatus" role="status" aria-live="polite"></span></div></details><script>(()=>{const storageKey='personal-memory-api-key';const panel=document.getElementById('apiAccess'),input=document.getElementById('apiAccessKey'),status=document.getElementById('apiAccessStatus');if(!panel||!input||!status)return;const saved=sessionStorage.getItem(storageKey)||'';if(saved){input.value=saved;status.textContent='Key ready for this session.'}const nativeFetch=window.fetch.bind(window);window.fetch=(resource,options={})=>{const key=sessionStorage.getItem(storageKey);const target=typeof resource==='string'?new URL(resource,location.href):new URL(resource.url,location.href);if(target.origin!==location.origin)return nativeFetch(resource,options);const headers=new Headers(options.headers||{});if(key)headers.set('authorization','Bearer '+key);return nativeFetch(resource,{...options,headers}).then(response=>{if(response.status===401||response.status===403){panel.open=true;status.textContent='API access is required for this operation.'}return response})};document.getElementById('apiAccessSave').onclick=()=>{const key=input.value.trim();if(!key){status.textContent='Enter an API key first.';input.focus();return}sessionStorage.setItem(storageKey,key);status.textContent='Key saved for this browser session.';panel.open=false;location.reload()};document.getElementById('apiAccessClear').onclick=()=>{sessionStorage.removeItem(storageKey);input.value='';status.textContent='Key cleared.';panel.open=false;location.reload()}})();</script><script>(()=>{const input=document.getElementById('apiAccessKey');if(input)input.placeholder='API key';const nativeOpen=window.open.bind(window);const localApi=(value)=>{const url=new URL(String(value),location.href);return url.origin===location.origin&&url.pathname.startsWith('/v1/')};window.open=(value,target,features)=>{if(!localApi(value))return nativeOpen(value,target,features);fetch(String(value)).then(async response=>{if(!response.ok)throw new Error('Download failed ('+response.status+')');const blob=await response.blob();const href=URL.createObjectURL(blob);nativeOpen(href,target,features);setTimeout(()=>URL.revokeObjectURL(href),60000)}).catch(error=>{const status=document.getElementById('apiAccessStatus');if(status){status.textContent=error.message;document.getElementById('apiAccess')?.setAttribute('open','')}});return null};document.addEventListener('click',event=>{const target=event.target;if(!(target instanceof Element))return;const link=target.closest('a[href]');if(!link||!localApi(link.href))return;event.preventDefault();fetch(link.href).then(async response=>{if(!response.ok)throw new Error('Source lookup failed ('+response.status+')');const blob=await response.blob();const href=URL.createObjectURL(blob);location.href=href;setTimeout(()=>URL.revokeObjectURL(href),60000)}).catch(error=>{const status=document.getElementById('apiAccessStatus');if(status){status.textContent=error.message;document.getElementById('apiAccess')?.setAttribute('open','')}})},true)})();</script><nav class="global-nav" aria-label="Primary navigation" style="margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><a href="/chat">Chat</a><a href="/ingest">Capture</a><a href="/sessions">Sessions</a><a href="/imports">Import</a><a href="/memories">Memory review</a><a href="/jobs">Processing</a><a href="/metrics">Metrics</a><a href="/status">Status</a><a href="/" aria-current="page">Audit console</a></nav></header>
<main><aside><div class="filters"><input id="name" aria-label="Filter audit runs" placeholder="Filter runs…"><input id="traceId" aria-label="Filter audit trace ID" placeholder="Trace ID…"><select id="status" aria-label="Filter audit status"><option value="">All statuses</option><option value="success">Success</option><option value="error">Errors</option><option value="running">Running</option></select><select id="kind" aria-label="Filter audit kind"><option value="">All run kinds</option><option value="retrieval">Retrieval</option><option value="chain">Chain</option><option value="llm">LLM</option><option value="tool">Tool</option><option value="validation">Validation</option><option value="security">Security</option></select><button id="saveFilter" aria-label="Save audit filter">Save filter</button><button id="clearFilter" aria-label="Clear saved audit filter">Clear saved</button><button id="refresh" aria-label="Refresh audit runs">↻</button></div><div id="runs" aria-live="polite"></div></aside><section id="detail" aria-live="polite"><div class="empty">Select a trace to inspect its waterfall.</div></section></main>
<script>
const $=id=>document.getElementById(id);let current;function esc(v){return String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(v){return v===undefined?'':JSON.stringify(v,null,2)}function traceStatus(message,traceId){$('traceStatus').innerHTML=esc(message)+(traceId?' · <a href="/?traceId='+encodeURIComponent(traceId)+'">Inspect trace</a>':'')}function replayConfirm(){return new Promise(resolve=>{$('traceStatus').innerHTML='Replay this retrieval? <button id="replayYes">Confirm replay</button><button id="replayNo">Cancel</button>';$('replayYes').focus();$('replayYes').onclick=()=>{traceStatus('');resolve(true)};$('replayNo').onclick=()=>{traceStatus('');resolve(false)}})}function filterState(){return {name:$('name').value,status:$('status').value,kind:$('kind').value}}function applySavedFilter(){try{const saved=JSON.parse(localStorage.getItem('personal-memory-audit-filter')||'null');if(saved){$('name').value=saved.name||'';$('status').value=saved.status||'';$('kind').value=saved.kind||''}}catch{}}async function load(){const f=filterState();const params=new URLSearchParams({limit:'100',...(f.name?{name:f.name}:{}),...(f.status?{status:f.status}:{}),...(f.kind?{kind:f.kind}:{})});try{const r=await fetch('/v1/admin/audit/runs?'+params);if(!r.ok)throw Error('Audit API returned '+r.status);const d=await r.json();$('runs').innerHTML=(d.runs||[]).filter(x=>!x.parentRunId).map(x=>'<div class="run '+(x.traceId===current?'active':'')+'" role="button" tabindex="0" aria-label="Inspect '+esc(x.name)+' trace" data-trace="'+esc(x.traceId)+'"><h3>'+esc(x.name)+'</h3><div class="meta"><span>'+new Date(x.startedAt).toLocaleTimeString()+' · '+esc(x.kind)+'</span><span class="'+(x.status==='success'?'success':'error')+'">'+esc(x.status)+'</span></div><div class="meta"><span>'+esc(x.traceId.slice(0,8))+'</span><span>'+(x.durationMs??'—')+' ms</span></div></div>').join('')||'<div class="empty">No traces match this filter.</div>';document.querySelectorAll('.run').forEach(x=>{x.onclick=()=>show(x.dataset.trace);x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(x.dataset.trace)}}})}catch(error){$('runs').innerHTML='<div class="empty error">Unable to load traces: '+esc(error.message)+'</div>'}}
async function show(id){current=id;await load();const r=await fetch('/v1/admin/audit/traces/'+encodeURIComponent(id));const d=await r.json();const roots=(d.runs||[]).filter(x=>!x.parentRunId);function node(x){const kids=(d.runs||[]).filter(y=>y.parentRunId===x.id);return '<div class="node"><div class="node-card"><div><div class="node-title">'+esc(x.name)+'</div><div class="node-kind">'+esc(x.kind)+' · '+esc(x.status)+'</div></div><div><span class="pill">'+(x.durationMs??'—')+' ms</span> <button type="button" class="toggle" aria-expanded="false">details</button></div><div class="node-detail">input: '+esc(fmt(x.input))+'\noutput: '+esc(fmt(x.output))+'\nmetadata: '+esc(fmt(x.metadata))+(x.error?'\nerror: '+esc(x.error):'')+'</div></div>'+kids.map(node).join('')+'</div>'}const root=d.runs[0];const replay=root&&root.name==='memory.recall'?'<button id="replay">Replay retrieval</button>':'';$('detail').innerHTML=root?'<div class="trace-head"><div><h1>'+esc(root.name)+'</h1><div class="meta">Trace '+esc(id)+'</div></div><div class="stats"><span class="pill">'+d.runs.length+' runs</span><span class="pill">'+esc(root.status)+'</span>'+replay+'<button id="export">Export</button></div></div><div id="traceStatus" class="trace-status" role="status" aria-live="polite" aria-atomic="true"></div><div class="tree">'+roots.map(node).join('')+'</div>':'<div class="empty">Trace not found.</div>';document.querySelectorAll('.toggle').forEach(x=>x.onclick=()=>{const card=x.closest('.node-card');const open=card.classList.toggle('open');x.setAttribute('aria-expanded',String(open))});$('export')?.addEventListener('click',()=>window.open('/v1/admin/audit/export','_blank'));$('replay')?.addEventListener('click',async()=>{if(!await replayConfirm())return;const button=$('replay');button.disabled=true;traceStatus('Replaying retrieval…');try{const rr=await fetch('/v1/admin/audit/traces/'+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:'replay'})});const result=await rr.json();if(!rr.ok)throw Object.assign(new Error(result.error||'Replay failed'),{traceId:result.traceId});const replayTrace=result.replay?.traceId;traceStatus('Replay completed.',replayTrace);if(replayTrace)await show(replayTrace)}catch(error){traceStatus(error.message,error.traceId)}finally{if($('replay'))$('replay').disabled=false}})}
applySavedFilter();$('refresh').onclick=load;$('saveFilter').onclick=()=>{localStorage.setItem('personal-memory-audit-filter',JSON.stringify(filterState()));load()};$('clearFilter').onclick=()=>{localStorage.removeItem('personal-memory-audit-filter');$('name').value='';$('status').value='';$('kind').value='';load()};$('name').oninput=load;$('status').onchange=load;$('kind').onchange=load;load();const initialTrace=new URLSearchParams(location.search).get('traceId');if(initialTrace)show(initialTrace);setInterval(load,3000);
</script><script>(()=>{const name=document.getElementById('name'),refresh=document.getElementById('refresh'),runs=document.getElementById('runs');if(!name||!refresh||!runs)return;const trace=document.createElement('input');trace.id='traceId';trace.type='search';trace.placeholder='Trace ID (paste from chat receipt)';trace.setAttribute('aria-label','Filter audit trace ID');name.insertAdjacentElement('afterend',trace);try{const saved=JSON.parse(localStorage.getItem('personal-memory-audit-filter')||'null');if(saved?.traceId)trace.value=saved.traceId}catch{}const nativeFetch=window.fetch.bind(window);window.fetch=(resource,options={})=>{const url=new URL(typeof resource==='string'?resource:resource.url,location.href);if(url.pathname==='/v1/admin/audit/runs'&&trace.value.trim())url.searchParams.set('name',trace.value.trim());return nativeFetch(url.toString(),options)};trace.addEventListener('input',()=>refresh.click());document.getElementById('saveFilter')?.addEventListener('click',()=>{try{const saved=JSON.parse(localStorage.getItem('personal-memory-audit-filter')||'{}');saved.traceId=trace.value.trim();localStorage.setItem('personal-memory-audit-filter',JSON.stringify(saved))}catch{}});document.getElementById('clearFilter')?.addEventListener('click',()=>{trace.value=''})})();</script><script>document.querySelectorAll('#traceId').forEach((item,index)=>{if(index>0)item.remove()})</script><script>(()=>{const detail=document.getElementById('detail');if(!detail)return;const enhance=()=>{const stats=detail.querySelector('.trace-head .stats'),meta=detail.querySelector('.trace-head .meta');if(!stats||!meta||document.getElementById('copyTrace'))return;const id=(meta.textContent||'').replace(/^Trace\s+/,'').trim();if(!id)return;const button=document.createElement('button');button.id='copyTrace';button.type='button';button.textContent='Copy trace ID';button.setAttribute('aria-label','Copy trace ID');button.onclick=async()=>{try{await navigator.clipboard.writeText(id);button.textContent='Trace ID copied';setTimeout(()=>{button.textContent='Copy trace ID'},1800)}catch{const status=document.getElementById('traceStatus');if(status)status.textContent='Clipboard unavailable; select the trace ID above to copy it.'}};stats.insertBefore(button,stats.firstChild)};new MutationObserver(enhance).observe(detail,{childList:true,subtree:true});enhance()})();</script></body></html>
