name: Go validation

on:
  push:
    paths:
      - "backend/janus-api/**"
      - "Janus-Zig/**"
      - "antithesis/**"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "backend/janus-api/**"
      - "Janus-Zig/**"
      - "antithesis/**"
      - "docker-compose.yml"
      - ".github/workflows/go.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus
          POSTGRES_DB: janus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JANUS_DATABASE_URL: postgres://janus:janus@127.0.0.1:5432/janus?sslmode=disable
      JANUS_TEST_DATABASE_URL: postgres://janus:janus@127.0.0.1:5432/janus?sslmode=disable
    defaults:
      run:
        working-directory: backend/janus-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/janus-api/go.mod
          cache: true
      - name: Apply database migrations
        run: go run ./cmd migrate
      - run: go test -count=1 -p 1 ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local property-test dependencies
        working-directory: .
        run: python -m pip install -r antithesis/requirements-local.txt
      - name: Run local lifecycle property checks
        working-directory: .
        run: python antithesis/AntiThesisLocal.py hypothesis

  zig:
    name: Zig foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Janus-Zig
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run local Zig parity gates
        run: python tools/verify_local.py
