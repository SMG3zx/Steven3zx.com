// The protocol between the Janus control plane and a Janus Agent, decided in
// ENG-78: one gRPC bidirectional stream per Agent, opened by the control plane
// to the Agent's listener on the tailnet. The Agent accepts only callers tagged
// tag:ctrl. Commands go down; replies and events come up on the same stream.
//
// Regenerate with `go generate ./internal/adapters/agentgrpc` (needs buf,
// protoc-gen-go and protoc-gen-go-grpc on PATH).
syntax = "proto3";

package janus.agent.v1;

option go_package = "janus/internal/adapters/agentgrpc/agentpb";

service Agent {
  // Connect carries every command and event between the control plane and one
  // Agent. The Agent sends its State as the first message, again after every
  // change, and a RunUsage after every run.
  rpc Connect(stream Command) returns (stream Event);
}

// Command is one instruction from the control plane. The Agent answers each
// with a Reply carrying the same id.
message Command {
  string id = 1;
  oneof action {
    Deploy deploy = 2;
    Stop stop = 3;
    Pause pause = 4;
    Resume resume = 5;
  }
}

// Deploy hands the Agent an Artifact's module to serve as a Deployment. The
// Agent checks the module against sha256, compiles it and runs one GET /
// probe; the Reply is empty when the Deployment is healthy and carries the
// reason when it failed.
message Deploy {
  string deployment_id = 1;
  bytes module = 2;
  // sha256 is the lower-case hex SHA-256 of module.
  string sha256 = 3;
  Limits limits = 4;
}

// Limits are the Template's per-request limits.
message Limits {
  uint64 fuel = 1;
  int64 memory_bytes = 2;
}

// Stop ends a Deployment: the Agent stops serving it and forgets it.
message Stop {
  string deployment_id = 1;
}

// Pause stops the Agent serving every Deployment until Resume.
message Pause {}

// Resume restores serving after Pause.
message Resume {}

// Event is one message from the Agent.
message Event {
  oneof kind {
    Reply reply = 1;
    State state = 2;
    RunUsage usage = 3;
  }
}

// Reply answers the Command with the same id. error is empty on success.
message Reply {
  string id = 1;
  string error = 2;
}

// State is what the Agent is doing now.
message State {
  bool paused = 1;
  repeated HostedDeployment deployments = 2;
}

message HostedDeployment {
  string deployment_id = 1;
  string sha256 = 2;
}

// RunUsage is what one run of a Deployment's module consumed. Network bytes
// are the request body the module read and the response body it wrote.
message RunUsage {
  string run_id = 1;
  string deployment_id = 2;
  uint64 fuel = 3;
  uint64 peak_memory_bytes = 4;
  int64 duration_ms = 5;
  int64 cpu_time_us = 6;
  uint64 network_bytes_in = 7;
  uint64 network_bytes_out = 8;
  // status is "ok", "failed", "out_of_fuel" or "timeout".
  string status = 9;
  string error = 10;
  // probe is true for the GET / run that decides a Deployment is healthy.
  bool probe = 11;
  int64 started_at_unix_ms = 12;
}
