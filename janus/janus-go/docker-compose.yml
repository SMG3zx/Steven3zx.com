services:
  # A standalone JetStream server for running services against
  # JANUS_NATS_URL=nats://127.0.0.1:4222. Without it, janus embeds its own.
  nats:
    image: nats:2.15.1-alpine
    container_name: janus-nats
    command: ["--config=/etc/nats/nats.conf"]
    restart: unless-stopped
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  # Janus with one container per service, all on the NATS server above:
  #   docker compose --profile services up -d
  # Each service keeps its own database in a volume of its own. Set
  # JANUS_JWT_SECRET (at least 32 random bytes) before starting them; a
  # service refuses to start without it.
  audit:
    &janus
    profiles: ["services"]
    build: .
    command: ["serve", "audit"]
    restart: unless-stopped
    depends_on:
      - nats
    environment: &janus-environment
      JANUS_NATS_URL: nats://nats:4222
      JANUS_JWT_SECRET: ${JANUS_JWT_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040

  identity:
    <<: *janus
    command: ["serve", "identity"]
    environment:
      <<: *janus-environment
      JANUS_IDENTITY_DATABASE_PATH: /data/identity.db
    volumes:
      - identity-data:/data

  projects:
    <<: *janus
    command: ["serve", "projects"]
    environment:
      <<: *janus-environment
      JANUS_PROJECTS_DATABASE_PATH: /data/projects.db
    volumes:
      - projects-data:/data

  builds:
    <<: *janus
    build:
      context: .
      target: builds
    command: ["serve", "builds"]
    environment:
      <<: *janus-environment
      JANUS_BUILDS_DATABASE_PATH: /data/builds.db
    volumes:
      - builds-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  runs:
    <<: *janus
    command: ["serve", "runs"]

  fleet:
    <<: *janus
    command: ["serve", "fleet"]
    environment:
      <<: *janus-environment
      JANUS_FLEET_DATABASE_PATH: /data/fleet.db
      HEADSCALE_URL: ${HEADSCALE_URL:-}
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
    volumes:
      - fleet-data:/data

  gateway:
    <<: *janus
    command: ["serve", "gateway"]
    environment:
      <<: *janus-environment
      JANUS_HTTP_ADDRESS: ":9090"
      JANUS_COOKIE_SECURE: ${JANUS_COOKIE_SECURE:-false}
      JANUS_WEB_UPSTREAM: http://web:3000
      HEADSCALE_URL: ${HEADSCALE_URL:-}
    ports:
      - "127.0.0.1:9090:9090"

  web:
    build: ../web
    profiles: ["services"]
    environment:
      JANUS_API_URL: http://gateway:9090
      JANUS_WEB_URL: ${JANUS_WEB_URL:-https://janus.steven3zx.com}
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - gateway

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: janus-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: janus-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    depends_on:
      - jaeger
      - loki
      - tempo

  loki:
    image: grafana/loki:3.6.4
    container_name: janus-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:2.9.0
    container_name: janus-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  pyroscope-init:
    image: busybox:1.37
    container_name: janus-pyroscope-init
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/pyroscope"]
    restart: "no"
    volumes:
      - pyroscope-data:/var/lib/pyroscope

  pyroscope:
    image: grafana/pyroscope:2.3.1
    container_name: janus-pyroscope
    command: ["-storage.filesystem.dir=/var/lib/pyroscope"]
    restart: unless-stopped
    depends_on:
      pyroscope-init:
        condition: service_completed_successfully
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    ports:
      - "127.0.0.1:4040:4040"

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: janus-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:12.4.11
    container_name: janus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-sharing}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://janus.steven3zx.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - tempo
      - pyroscope
      - prometheus

volumes:
  nats-data:
  identity-data:
  projects-data:
  builds-data:
  fleet-data:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:
  pyroscope-data:
