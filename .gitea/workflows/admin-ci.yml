# Runs on the self-hosted Gitea runner (edge/gitea). GitHub does not read .gitea/.
# The deploy job runs on the deploy runner (gitea-runner-deploy in edge/compose.yaml)
# after both checks pass on master, and it rebuilds and restarts the admin container.
name: admin-ci

on:
  push:
    paths:
      - "portfolio/admin/**"
      - "edge/compose.yaml"
      - ".gitea/workflows/admin-ci.yml"
  workflow_dispatch:

# The server job runs in the steven3zx-ci-go image (Go 1.27 plus Bun, with Bun as node), see edge/gitea/ci-go.
# Shared caches, mounted from the steven3zx-ci-cache volume by the runner.
env:
  GOMODCACHE: /ci-cache/go/mod
  GOCACHE: /ci-cache/go/build
  BUN_INSTALL_CACHE_DIR: /ci-cache/bun

jobs:
  server:
    runs-on: golang
    defaults:
      run:
        working-directory: portfolio/admin/server
    steps:
      - uses: actions/checkout@v4
      - run: go vet ./...
      - run: go test -count=1 ./...

  web:
    runs-on: bun
    defaults:
      run:
        working-directory: portfolio/admin/web
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Rebuilds the admin image and recreates its container on the origin host. The
  # deploy runner is the only one with the Docker socket. Secrets come from the repo's
  # Actions secrets: HOST_AGENT_TOKEN and ADMIN_DB_KEY, the same values as in edge/.env.
  deploy:
    needs: [server, web]
    if: github.ref == 'refs/heads/master'
    runs-on: deploy
    # The deploy image is Alpine and has no bash, so run the steps with sh.
    defaults:
      run:
        shell: sh
    env:
      HOST_AGENT_TOKEN: ${{ secrets.HOST_AGENT_TOKEN }}
      ADMIN_DB_KEY: ${{ secrets.ADMIN_DB_KEY }}
    steps:
      - uses: actions/checkout@v4
      # An unset secret would recreate the admin container without its token or key,
      # and the server exits at start. Stop before touching the running container.
      - name: Check deploy secrets
        run: |
          if [ -z "$HOST_AGENT_TOKEN" ] || [ -z "$ADMIN_DB_KEY" ]; then
            echo "Set the HOST_AGENT_TOKEN and ADMIN_DB_KEY Actions secrets first." >&2
            exit 1
          fi
      - name: Rebuild and restart the admin container
        run: docker compose -f edge/compose.yaml up -d --build admin
      - name: Show admin status
        run: docker compose -f edge/compose.yaml ps admin
